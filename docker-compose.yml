services:
  postgres:
    image: postgres:16-alpine
    container_name: maskan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maskan_db}
      POSTGRES_USER: ${POSTGRES_USER:-maskan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maskan_secret_dev}
    ports:
      - "5432:5432"
    volumes:
      - maskan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maskan} -d ${POSTGRES_DB:-maskan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: maskan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-maskan_db}
      DATABASE_USER: ${POSTGRES_USER:-maskan}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-maskan_secret_dev}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: maskan-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  maskan_pgdata:
